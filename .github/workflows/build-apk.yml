name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil file
        uses: actions/checkout@v4

      - name: Ekstrak proyek
        run: unzip -o project.zip -d proj

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Siapkan Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: proj
        run: gradle assembleRelease --no-daemon

      - name: Beri nama file
        run: cp proj/app/build/outputs/apk/release/app-release.apk DataReader.apk

      - name: Unggah hasil
        uses: actions/upload-artifact@v4
        with:
          name: DataReader-apk
          path: DataReader.apk
